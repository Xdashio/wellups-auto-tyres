name: ci

on:
  push:
    branches: [main, v0.1-implementation, "release/*"]
    # Tags are validated on the exact tagged commit. Tag CI never deploys;
    # production deployment is tag-gated separately (see release.yml).
    tags: ["v*"]
  pull_request:

jobs:
  # Runner routing: GitHub-hosted runners are currently unusable on this
  # account (billing lock — see docs/RELEASE.md "CI AVAILABILITY NOTE").
  # Self-hosted runners are free and need no billing. Both jobs read their
  # runner label set from the repository variable CI_RUNS_ON (a JSON array,
  # e.g. ["self-hosted"]), defaulting to ["ubuntu-latest"] when unset. Set
  # the variable to route CI — including tag validation — to a self-hosted
  # runner; delete it to restore the default. This changes WHERE jobs run,
  # never WHAT they run: tag validation is never skipped.
  # Setup steps: docs/CI_SELF_HOSTED.md.
  app:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx opennextjs-cloudflare build

  db:
    # Same runner routing as the app job above. NOTE: this job uses a
    # postgres:18 service container, so a self-hosted runner must have
    # Docker available or this job will fail — see docs/CI_SELF_HOSTED.md.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      DB_NAME: wellups_ci
    steps:
      - uses: actions/checkout@v4
      - name: Build pgTAP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-server-dev-18 libpq-dev make git
          git clone --depth 1 https://github.com/theory/pgtap.git /tmp/pgtap
          make -C /tmp/pgtap sql/pgtap.sql PG_CONFIG=/usr/lib/postgresql/18/bin/pg_config
      - name: Database gate
        run: PGTAP_SQL=/tmp/pgtap/sql/pgtap.sql ./scripts/ci-db.sh
