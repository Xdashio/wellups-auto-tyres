name: ci

on:
  push:
    branches: [main, v0.1-implementation]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx opennextjs-cloudflare build

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      DB_NAME: wellups_ci
    steps:
      - uses: actions/checkout@v4
      - name: Build pgTAP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-server-dev-18 libpq-dev make git
          git clone --depth 1 https://github.com/theory/pgtap.git /tmp/pgtap
          make -C /tmp/pgtap sql/pgtap.sql PG_CONFIG=/usr/lib/postgresql/18/bin/pg_config
      - name: Database gate
        run: PGTAP_SQL=/tmp/pgtap/sql/pgtap.sql ./scripts/ci-db.sh
